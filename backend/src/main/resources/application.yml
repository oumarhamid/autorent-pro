spring:
  application:
    name: autorent-backend
  profiles:
    default: dev

server:
  port: ${BACKEND_PORT:8080}

  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:30m}
      cookie:
        http-only: true
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: never